services:
  postgres:
    image: postgres:17
    container_name: eskan-postgres
    environment:
      POSTGRES_USER: eskan
      POSTGRES_PASSWORD: eskan_dev_password
      POSTGRES_DB: eskan_dev
    ports:
      - "5432:5432"
    volumes:
      - eskan_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eskan -d eskan_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  eskan_pgdata: