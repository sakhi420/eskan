name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: eskan
          POSTGRES_PASSWORD: eskan_dev_password
          POSTGRES_DB: eskan_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eskan -d eskan_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://eskan:eskan_dev_password@localhost:5432/eskan_dev
      NODE_ENV: test
      # Test-only, non-secret placeholder required by the config validator.
      JWT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build

      - name: Validate OpenAPI contract
        run: npm run openapi:validate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Unit tests
        run: npm test

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: M-2 preflight (read-only, strict = clean baseline)
        run: node scripts/preflight-m2.cjs --strict
        env:
          PREFLIGHT_ALLOW: "1"

      - name: M-2 preflight detection (seeded cross-tenant anomalies)
        run: node scripts/test-m2-preflight-detection.cjs

      - name: M-2 preflight guard (fail-closed on non-test DB)
        run: |
          set +e
          DATABASE_URL="postgresql://eskan:eskan_dev_password@localhost:5432/eskan_prod" node scripts/preflight-m2.cjs --strict
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then echo "expected guard exit 2, got $code"; exit 1; fi

      - name: E2E smoke tests
        run: npm run test:e2e

      - name: M-1 migration & DB constraint tests
        run: node scripts/test-m1-migration.cjs

      - name: M-2 migration & DB constraint tests
        run: node scripts/test-m2-migration.cjs

      - name: M-2 package/hostel concurrency tests
        run: node scripts/test-m2-package-hostel-concurrency.cjs

      - name: M-2 Prisma parity test (migrate diff empty)
        run: node scripts/test-m2-prisma-parity.cjs

      - name: Idempotency retention consistency CHECK tests
        run: node scripts/test-idempotency-retention-check.cjs

      - name: M3a migrations & DB constraint tests
        run: node scripts/test-m3a-migration.cjs

      - name: M3b migrations & DB constraint tests
        run: node scripts/test-m3b-migration.cjs

      - name: PostgreSQL integration tests (lifecycle + concurrency + tenant isolation)
        run: npm run test:integration