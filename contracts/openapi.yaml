openapi: 3.0.3
info:
  title: ESKAN Backend API
  version: 0.5.0
  description: |
    قرارداد رسمی API سامانهٔ اسکان (ESKAN) — مدیریت لیلیه‌های خصوصی.
    منبع حقیقت قرارداد: این فایل. مسیر محصول زیر `/api/v1`.
  contact:
    name: ESKAN Engineering
  license:
    name: Proprietary
servers:
  - url: http://localhost:3000
    description: local development
tags:
  - name: system
    description: health and service metadata
  - name: auth
    description: authentication and session management
  - name: organizations
    description: organization profile and memberships
  - name: hostels
    description: hostels master data
  - name: rooms
    description: rooms of a hostel
  - name: beds
    description: beds of a room
  - name: residents
    description: residents and their accounts
  - name: contracts
    description: stay contracts
  - name: packages
    description: accommodation service packages
  - name: absences
    description: temporary absences and deductions
  - name: bed-assignments
    description: bed assignment lifecycle
  - name: charges
    description: charges (billed obligations)
  - name: payments
    description: payments and allocations
  - name: deposits
    description: deposit / security transactions
  - name: expenses
    description: paid expenses
  - name: reports
    description: dashboard and financial reports
  - name: sync
    description: offline-first synchronization
  - name: subscriptions
    description: subscription plans, trial and entitlements
  - name: platform-admin
    description: platform admin subscription management
security:
  - bearerAuth: []
    xOrganizationId: []
paths:
  /health/live:
    get:
      tags: [system]
      summary: liveness probe
      operationId: healthLive
      security: []
      responses:
        '200':
          description: alive
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }
  /health/ready:
    get:
      tags: [system]
      summary: readiness probe (database reachable)
      operationId: healthReady
      security: []
      responses:
        '200':
          description: ready
          content:
            application/json:
              schema:
                type: object
                required: [status, database]
                properties:
                  status: { type: string, enum: [ready] }
                  database: { type: string, enum: [up, down] }
        '503':
          $ref: '#/components/responses/Error'
  /api/v1/system/version:
    get:
      tags: [system]
      summary: service version
      operationId: systemVersion
      security: []
      responses:
        '200':
          description: service version
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [name, version, apiVersion]
                    properties:
                      name: { type: string }
                      version: { type: string }
                      apiVersion: { type: string }
                  meta: { $ref: '#/components/schemas/Meta' }
  /api/v1/system/me:
    get:
      tags: [system]
      summary: authenticated user summary
      operationId: systemMe
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: current user
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/UserSummary' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/register:
    post:
      tags: [auth]
      summary: register owner account + organization (config-controlled)
      operationId: authRegister
      security: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/AuthSession' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: login
      operationId: authLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: session created
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/AuthSession' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: rotate refresh token
      operationId: authRefresh
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: new access + rotated refresh
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/AuthSession' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: revoke current session
      operationId: authLogout
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '204': { description: revoked }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/auth/logout-all:
    post:
      tags: [auth]
      summary: revoke all sessions of the user
      operationId: authLogoutAll
      security: [{ bearerAuth: [] }]
      responses:
        '409': { $ref: '#/components/responses/Conflict' }
        '204': { description: revoked }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: current user
      operationId: authMe
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: current user
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/UserSummary' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/auth/change-password:
    post:
      tags: [auth]
      summary: change own password
      operationId: authChangePassword
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '409': { $ref: '#/components/responses/Conflict' }
        '204': { description: changed }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/organizations/current:
    get:
      tags: [organizations]
      summary: current organization profile
      operationId: organizationGetCurrent
      responses:
        '200':
          description: organization
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Organization' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [organizations]
      summary: update organization profile
      operationId: organizationPatchCurrent
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: X-Expected-Version
          required: true
          schema: { type: integer }
          description: expected version
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationUpdateRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '200':
          description: updated
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Organization' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/organizations/current/members:
    get:
      tags: [organizations]
      summary: list members
      operationId: organizationListMembers
      responses:
        '200':
          description: members
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Membership' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/organizations/current/members/{membershipId}:
    patch:
      tags: [organizations]
      summary: change member role/active (owner only)
      operationId: organizationPatchMember
      parameters:
        - in: path
          name: membershipId
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: X-Expected-Version
          required: true
          schema: { type: integer }
          description: expected version
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MembershipUpdateRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '200':
          description: updated
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Membership' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '409': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/hostels:
    get:
      tags: [hostels]
      summary: list hostels
      operationId: hostelList
      parameters:
        - { name: page, in: query, required: false, schema: { type: integer, default: 1 } }
        - { name: size, in: query, required: false, schema: { type: integer, default: 20 } }
        - { name: q, in: query, required: false, schema: { type: string } }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: hostels
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/HostelPage' }
                  meta: { $ref: '#/components/schemas/Meta' }
    post:
      tags: [hostels]
      summary: create hostel
      operationId: hostelCreate
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HostelRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '201':
          description: created
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Hostel' }
                  meta: { $ref: '#/components/schemas/Meta' }
  /api/v1/hostels/{hostelId}:
    get:
      tags: [hostels]
      summary: get hostel
      operationId: hostelGet
      parameters: [{ name: hostelId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '200':
          description: hostel
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Hostel' }
                  meta: { $ref: '#/components/schemas/Meta' }
    patch:
      tags: [hostels]
      summary: update hostel
      operationId: hostelUpdate
      parameters:
        - { name: hostelId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
        - { name: X-Expected-Version, in: header, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HostelRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '200':
          description: updated
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Hostel' }
                  meta: { $ref: '#/components/schemas/Meta' }
  /api/v1/hostels/{hostelId}/archive:
    post:
      tags: [hostels]
      summary: archive hostel
      operationId: hostelArchive
      parameters:
        - { name: hostelId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '404': { $ref: '#/components/responses/NotFound' }
        '200':
          description: archived
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Hostel' }
                  meta: { $ref: '#/components/schemas/Meta' }
  /api/v1/hostels/{hostelId}/rooms:
    get:
      tags: [rooms]
      summary: list rooms of a hostel
      operationId: roomList
      parameters:
        - { name: hostelId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: page, in: query, required: false, schema: { type: integer, default: 1 } }
        - { name: size, in: query, required: false, schema: { type: integer, default: 20 } }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '200':
          description: rooms
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/RoomPage' }
                  meta: { $ref: '#/components/schemas/Meta' }
    post:
      tags: [rooms]
      summary: create room
      operationId: roomCreate
      parameters:
        - { name: hostelId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoomRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '201':
          description: created
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Room' }
                  meta: { $ref: '#/components/schemas/Meta' }
  /api/v1/rooms/{roomId}:
    get:
      tags: [rooms]
      summary: get room
      operationId: roomGet
      parameters: [{ name: roomId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '200':
          description: room
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Room' }
                  meta: { $ref: '#/components/schemas/Meta' }
    patch:
      tags: [rooms]
      summary: update room
      operationId: roomUpdate
      parameters:
        - { name: roomId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
        - { name: X-Expected-Version, in: header, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoomRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '200':
          description: updated
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Room' }
                  meta: { $ref: '#/components/schemas/Meta' }
  /api/v1/rooms/{roomId}/archive:
    post:
      tags: [rooms]
      summary: archive room
      operationId: roomArchive
      parameters:
        - { name: roomId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '404': { $ref: '#/components/responses/NotFound' }
        '200':
          description: archived
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Room' }
                  meta: { $ref: '#/components/schemas/Meta' }
  /api/v1/rooms/{roomId}/beds:
    get:
      tags: [beds]
      summary: list beds of a room
      operationId: bedList
      parameters:
        - { name: roomId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: page, in: query, required: false, schema: { type: integer, default: 1 } }
        - { name: size, in: query, required: false, schema: { type: integer, default: 20 } }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '200':
          description: beds
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/BedPage' }
                  meta: { $ref: '#/components/schemas/Meta' }
    post:
      tags: [beds]
      summary: create bed
      operationId: bedCreate
      parameters:
        - { name: roomId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BedRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '201':
          description: created
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Bed' }
                  meta: { $ref: '#/components/schemas/Meta' }
  /api/v1/beds/{bedId}:
    get:
      tags: [beds]
      summary: get bed
      operationId: bedGet
      parameters: [{ name: bedId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '200':
          description: bed
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Bed' }
                  meta: { $ref: '#/components/schemas/Meta' }
    patch:
      tags: [beds]
      summary: update bed
      operationId: bedUpdate
      parameters:
        - { name: bedId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
        - { name: X-Expected-Version, in: header, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BedRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '200':
          description: updated
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Bed' }
                  meta: { $ref: '#/components/schemas/Meta' }
  /api/v1/beds/{bedId}/deactivate:
    post:
      tags: [beds]
      summary: deactivate bed
      operationId: bedDeactivate
      parameters:
        - { name: bedId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '404': { $ref: '#/components/responses/NotFound' }
        '200':
          description: deactivated
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Bed' }
                  meta: { $ref: '#/components/schemas/Meta' }
  /api/v1/hostels/{hostelId}/packages:
    get:
      tags: [packages]
      summary: list accommodation packages for a hostel
      operationId: packageList
      parameters:
        - { name: hostelId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: page, in: query, required: false, schema: { type: integer, default: 1 } }
        - { name: size, in: query, required: false, schema: { type: integer, default: 20 } }
      responses:
        '200':
