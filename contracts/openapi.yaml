      tags: [platform-admin]
      summary: grant a grace period (platform admin only)
      operationId: adminSubscriptionGrantGrace
      security: [{ bearerAuth: [] }]
      description: requires PLATFORM_ADMIN system-level role
      parameters:
        - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminGrantGraceRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '200':
          description: subscription updated
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/OrganizationSubscription' }
                  meta: { $ref: '#/components/schemas/Meta' }
  /api/v1/admin/organizations/{organizationId}/subscription/payments:
    post:
      tags: [platform-admin]
      summary: record a verified manual subscription payment (platform admin only)
      operationId: adminSubscriptionPayment
      security: [{ bearerAuth: [] }]
      description: requires PLATFORM_ADMIN system-level role; records an out-of-band verified payment
      parameters:
        - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminManualPaymentRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '200':
          description: payment recorded
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/ManualSubscriptionPayment' }
                  meta: { $ref: '#/components/schemas/Meta' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    xOrganizationId:
      type: apiKey
      in: header
      name: X-Organization-Id
      description: selector only; authority verified server-side
  responses:
    Error:
      description: error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: not authenticated
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: not authorized
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: conflict (version/state/idempotency)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: too many requests
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Meta:
      type: object
      required: [traceId]
      properties:
        traceId: { type: string }
    Error:
      type: object
      required: [type, title, status, detail, code, traceId]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { $ref: '#/components/schemas/ErrorCode' }
        traceId: { type: string }
        errors:
          type: array
          items: { $ref: '#/components/schemas/FieldError' }
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field: { type: string }
        code: { type: string }
        message: { type: string }
    ErrorCode:
      type: string
      enum:
        - VALIDATION_ERROR
        - UNAUTHENTICATED
        - FORBIDDEN
        - RESOURCE_NOT_FOUND
        - RESOURCE_VERSION_CONFLICT
        - IDEMPOTENCY_KEY_REUSED
        - DUPLICATE_RECEIPT_NUMBER
        - BED_ASSIGNMENT_OVERLAP
        - RESIDENT_CONTRACT_OVERLAP
        - CONTRACT_NOT_ACTIVE
        - CHARGE_ALREADY_REVERSED
        - PAYMENT_ALREADY_REVERSED
        - ALLOCATION_EXCEEDS_PAYMENT
        - PLAN_LIMIT_EXCEEDED
        - DEPOSIT_BALANCE_INSUFFICIENT
        - SYNC_RESYNC_REQUIRED
        - SYNC_CURSOR_INVALID
        - BUSINESS_RULE_VIOLATION
        - RATE_LIMITED
        - REGISTRATION_DISABLED
        - DUPLICATE_CODE
        - RESOURCE_HAS_ACTIVE_ASSIGNMENT
        - REFRESH_TOKEN_REUSED
        - REFRESH_TOKEN_ROTATION_CONFLICT
        - ORGANIZATION_CONTEXT_REQUIRED
        - AMOUNT_OUT_OF_RANGE
        - ALLOCATION_EXCEEDS_CHARGE
        - ALLOCATION_ALREADY_RELEASED
        - RELEASE_EXCEEDS_ALLOCATION
        - DEPOSIT_ALREADY_REVERSED
        - PAYMENT_REFUND_EXCEEDS_UNALLOCATED
        - REFUND_EXCEEDS_DEPOSIT_BALANCE
        - BILLING_RUN_DUPLICATE
        - RESIDENT_MISMATCH
        - ABSENCE_ALREADY_CREDITED
        - INTERNAL_ERROR
    PlanCode:
      type: string
      enum: [FREE, PRO, BUSINESS]
    PlanStatus:
      type: string
      enum: [DRAFT, PUBLISHED, ARCHIVED]
    PlanBillingCycle:
      type: string
      enum: [MONTHLY, YEARLY]
    SubscriptionStatus:
      type: string
      enum: [TRIALING, ACTIVE, GRACE_PERIOD, FREE, EXPIRED, SUSPENDED]
    SubscriptionAction:
      type: string
      enum: [TRIAL_STARTED, TRIAL_ENDED, PLAN_ACTIVATED, PLAN_EXTENDED, PLAN_CHANGED, PLAN_DOWNGRADED, SUSPENDED, RESUMED, GRACE_GRANTED, PAYMENT_VERIFIED]
    PlanLimits:
      type: object
      required: [advancedReports, csvExport, detailedFinance]
      properties:
        maxHostels: { type: integer, nullable: true }
        maxRooms: { type: integer, nullable: true }
        maxBeds: { type: integer, nullable: true }
        maxResidents: { type: integer, nullable: true }
        maxMembers: { type: integer, nullable: true }
        maxDevices: { type: integer, nullable: true }
        advancedReports: { type: boolean }
        csvExport: { type: boolean }
        detailedFinance: { type: boolean }
    SubscriptionPlan:
