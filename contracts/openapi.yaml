        updatedAt: { type: string, format: date-time }
    AccommodationPackageRequest:
      type: object
      required: [name, components]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 1000 }
        components:
          type: array
          items: { $ref: '#/components/schemas/PackageComponent' }
    AccommodationPackagePage:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AccommodationPackage' }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer }
        totalPages: { type: integer }
    TemporaryAbsence:
      type: object
      required: [id, version, organizationId, residentId, contractId, status, plannedDepartureDate, expectedReturnDate, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer }
        organizationId: { type: string, format: uuid }
        residentId: { type: string, format: uuid }
        contractId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/AbsenceStatus' }
        plannedDepartureDate: { type: string, format: date }
        actualDepartureDate: { type: string, format: date }
        expectedReturnDate: { type: string, format: date }
        actualReturnDate: { type: string, format: date }
        reason: { type: string }
        notes: { type: string }
        requestedBy: { type: string, format: uuid }
        approvedBy: { type: string, format: uuid }
        approvedAt: { type: string, format: date-time }
        credits:
          type: array
          items: { $ref: '#/components/schemas/AbsenceCredit' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TemporaryAbsenceCreateRequest:
      type: object
      description: "Creates an absence (starts as REQUESTED). `actualReturnDate`/RETURNED/CLOSED cannot be set at creation; record the return via PATCH then generate credits via POST /absences/{id}/credits."
      required: [contractId, plannedDepartureDate, expectedReturnDate]
      properties:
        contractId: { type: string, format: uuid }
        plannedDepartureDate: { type: string, format: date }
        expectedReturnDate: { type: string, format: date }
        reason: { type: string, maxLength: 500 }
        notes: { type: string, maxLength: 2000 }
    TemporaryAbsenceUpdateRequest:
      type: object
      description: "Updates an absence. `actualReturnDate` moves it to RETURNED (credit generation is a separate POST). CLOSED cannot be set directly."
      properties:
        plannedDepartureDate: { type: string, format: date }
        actualDepartureDate: { type: string, format: date }
        expectedReturnDate: { type: string, format: date }
        actualReturnDate: { type: string, format: date, description: "Records the actual return; moves the absence to RETURNED." }
        reason: { type: string, maxLength: 500 }
        notes: { type: string, maxLength: 2000 }
    TemporaryAbsencePage:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TemporaryAbsence' }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer }
        totalPages: { type: integer }
    SyncDevice:
      type: object
      required: [id, organizationId, deviceId, platform, lastCursor, createdAt]
      properties:
        id: { type: string, format: uuid }
        memberships:
          type: array
          items: { $ref: '#/components/schemas/MembershipSummary' }
        deviceId: { type: string }
        platform: { type: string }
        lastCursor: { type: integer }
        createdAt: { type: string, format: date-time }
    SyncChange:
      type: object
      required: [sequence, entityType, entityId, action, entityVersion, occurredAt]
      properties:
        sequence: { type: integer }
        entityType: { type: string }
        entityId: { type: string, format: uuid }
        action: { $ref: '#/components/schemas/SyncAction' }
        entityVersion: { type: integer }
        occurredAt: { type: string, format: date-time }
    SyncChangesResponse:
      type: object
      required: [changes, nextCursor, hasMore, schemaVersion]
      properties:
        changes:
          type: array
          items: { $ref: '#/components/schemas/SyncChange' }
        nextCursor: { type: integer }
        hasMore: { type: boolean }
        minAvailableCursor: { type: integer }
        schemaVersion: { type: integer }
        resyncRequired: { type: boolean }
    SyncStatus:
      type: object
      required: [currentCursor, schemaVersion]
      properties:
        currentCursor: { type: integer }
        schemaVersion: { type: integer }
        deviceLastCursor: { type: integer }
        deviceId: { type: string }
