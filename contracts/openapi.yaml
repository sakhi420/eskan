    AccommodationPackage:
      type: object
      required: [id, version, organizationId, name, status, components, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer }
        memberships:
          type: array
          items: { $ref: '#/components/schemas/MembershipSummary' }
        hostelId: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        status: { type: string, enum: [ACTIVE, ARCHIVED] }
