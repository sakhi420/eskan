          items: { $ref: '#/components/schemas/Expense' }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer }
        totalPages: { type: integer }
    Money:
      type: object
      description: "Positive AFN amount (integer Afghani) for a single financial document. MUST be 1..2147483647. Never negative; direction (debit/credit) is expressed by an explicit side field, not by sign."
      required: [amount, currency]
      properties:
        amount: { type: integer, minimum: 1, maximum: 2147483647 }
        currency: { type: string, enum: [AFN] }
    NonNegativeMoney:
      type: object
      description: "AFN amount that may be zero. Reserved for optional/orderable values (e.g. a contract deposit of zero). Financial documents MUST NOT use this; they use Money."
      required: [amount, currency]
      properties:
        amount: { type: integer, minimum: 0, maximum: 2147483647 }
        currency: { type: string, enum: [AFN] }
    Amount:
      type: string
      description: "Aggregate/running-balance AFN amount serialized as a decimal-string integer (max 19 digits) so account/report totals cannot overflow. Always AFN; never a float."
      pattern: '^[0-9]{1,19}$'
    UserSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        fullName: { type: string }
        createdAt: { type: string, format: date-time }
    AuthSession:
      type: object
      required: [accessToken, refreshToken, expiresIn, user, memberships]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer }
        user: { $ref: '#/components/schemas/UserSummary' }
        memberships:
          type: array
          items: { $ref: '#/components/schemas/MembershipSummary' }
    RegisterRequest:
      type: object
      required: [email, password, fullName, organizationName]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 72 }
        fullName: { type: string, minLength: 1, maxLength: 200 }
        organizationName: { type: string, minLength: 1, maxLength: 200 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string }
        newPassword: { type: string, minLength: 8, maxLength: 72 }
    OrganizationUpdateRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        timezone: { type: string, description: IANA timezone name, example: Asia/Kabul }
        defaultCurrency: { type: string, enum: [AFN] }
    InvitationRequest:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
    Invitation:
      type: object
      required: [id, organizationId, email, role, status, expiresAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        status: { type: string, enum: [PENDING, ACCEPTED, REVOKED, EXPIRED] }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        acceptedAt: { type: string, format: date-time }
    InvitationCreated:
      type: object
      required: [invitation, token]
      properties:
        invitation: { $ref: '#/components/schemas/Invitation' }
        token: { type: string, description: raw one-time token shown only once }
    InvitationAcceptRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }
    MembershipUpdateRequest:
      type: object
      properties:
        role: { $ref: '#/components/schemas/Role' }
        active: { type: boolean }
    HostelRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        address: { type: string, maxLength: 500 }
        contactPhone: { type: string, maxLength: 50 }
        defaultRentAmount: { type: integer, minimum: 0 }
        rentDueDayOfMonth: { type: integer, minimum: 1, maximum: 31 }
        absenceMinDays: { type: integer, minimum: 1 }
        notes: { type: string, maxLength: 2000 }
    RoomRequest:
      type: object
      required: [code, floor]
      properties:
        code: { type: string, minLength: 1, maxLength: 50 }
        floor: { type: integer }
        maintenanceStatus: { $ref: '#/components/schemas/MaintenanceStatus' }
        notes: { type: string, maxLength: 1000 }
    BedRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, minLength: 1, maxLength: 50 }
        maintenanceStatus: { $ref: '#/components/schemas/MaintenanceStatus' }
        notes: { type: string, maxLength: 1000 }
    ResidentRequest:
      type: object
      required: [fullName, type]
      properties:
        fullName: { type: string, minLength: 1, maxLength: 200 }
        type: { $ref: '#/components/schemas/ResidentType' }
        phone: { type: string, maxLength: 50 }
        emergencyContactName: { type: string, maxLength: 200 }
        emergencyContactPhone: { type: string, maxLength: 50 }
        emergencyContactRelation: { type: string, maxLength: 100 }
        notes: { type: string, maxLength: 2000 }
    ContractRequest:
      type: object
      description: "`endDate` is exclusive (half-open [startDate, endDate)); the last inclusive stay day is endDate - 1 day. Checkout (closing) sets endDate = lastDay + 1."
      required: [hostelId, residentId, startDate, rent]
      properties:
        hostelId: { type: string, format: uuid }
        residentId: { type: string, format: uuid }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        rent: { $ref: '#/components/schemas/Money' }
        billingCycle: { type: string, enum: [MONTHLY] }
        deposit: { $ref: '#/components/schemas/NonNegativeMoney' }
        packageId: { type: string, format: uuid }
        packageComponents:
          type: array
          items: { $ref: '#/components/schemas/PackageComponent' }
        notes: { type: string, maxLength: 2000 }
    BedAssignmentRequest:
      type: object
      description: "`endDate` is exclusive (half-open [startDate, endDate)); leave unset for an open-ended assignment (COALESCE to infinity)."
      required: [bedId, residentId, contractId, startDate]
      properties:
        bedId: { type: string, format: uuid }
        residentId: { type: string, format: uuid }
        contractId: { type: string, format: uuid }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
    ChargeRequest:
      type: object
      description: "Creates an obligation posting. `entrySide` defaults to DEBIT; use CREDIT only for positive-amount discounts/absence credits (D-02/D-07). `periodEnd` is exclusive (half-open [periodStart, periodEnd))."
      required: [residentId, type, money, periodStart, periodEnd, dueDate]
      properties:
        residentId: { type: string, format: uuid }
        contractId: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/ChargeType' }
        entrySide: { $ref: '#/components/schemas/EntrySide' }
        money: { $ref: '#/components/schemas/Money' }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        dueDate: { type: string, format: date }
        description: { type: string, maxLength: 1000 }
    PaymentAllocationRequest:
      type: object
      required: [chargeId, money]
      properties:
        chargeId: { type: string, format: uuid }
        money: { $ref: '#/components/schemas/Money' }
    PaymentRequest:
      type: object
      description: "Records an unallocated payment. `receiptNumber` is issued by the server only after commit (D-03); clients MUST NOT send it. Offline clients send a local `provisionalReceiptId`; the server maps it to the official number in the response. Allocation is a separate operation and is not accepted here (section 4.2 of the execution directive)."
      required: [residentId, money, method, receivedAt]
      properties:
        residentId: { type: string, format: uuid }
        money: { $ref: '#/components/schemas/Money' }
        method: { $ref: '#/components/schemas/PaymentMethod' }
        receivedAt: { type: string, format: date }
        notes: { type: string, maxLength: 1000 }
        payerName: { type: string, maxLength: 200 }
        payerPhone: { type: string, maxLength: 50 }
        payerRelation: { type: string, maxLength: 100 }
        provisionalReceiptId: { type: string, maxLength: 200 }
    ReversalRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
    DepositRequest:
      type: object
      description: "Receive a deposit (RECEIVED event). Refund/forfeit are separate operations with their own endpoints; application to charges is the separate DepositApplication operation."
      required: [money, receivedAt]
      properties:
        money: { $ref: '#/components/schemas/Money' }
        receivedAt: { type: string, format: date }
        reason: { type: string, maxLength: 500 }
    ExpenseRequest:
      type: object
      required: [category, money, spentAt]
      properties:
        category: { type: string, minLength: 1, maxLength: 100 }
        money: { $ref: '#/components/schemas/Money' }
        spentAt: { type: string, format: date }
        hostelId: { type: string, format: uuid }
        paymentMethod: { $ref: '#/components/schemas/PaymentMethod' }
        description: { type: string, maxLength: 1000 }
    SyncDeviceRegisterRequest:
      type: object
      required: [deviceId, platform]
      properties:
        deviceId: { type: string, minLength: 1, maxLength: 200 }
        platform: { type: string, enum: [ANDROID, WINDOWS, OTHER] }
        appVersion: { type: string, maxLength: 50 }
    Role:
      type: string
      enum: [OWNER, ADMIN, OPERATOR, VIEWER]
    ResidentType:
      type: string
      enum: [STUDENT, WORKER, OTHER]
    ResidentStatus:
      type: string
      enum: [ACTIVE, INACTIVE, ARCHIVED]
    ContractStatus:
      type: string
      enum: [DRAFT, ACTIVE, TERMINATED, CLOSED]
    ChargeType:
      type: string
      enum: [RENT, UTILITY, DAMAGE, OTHER, ADJUSTMENT]
    LedgerEntryStatus:
      type: string
      enum: [POSTED, REVERSED]
    PaymentMethod:
      type: string
      enum: [CASH, BANK_TRANSFER, MOBILE_MONEY, OTHER]
    DepositType:
      type: string
      description: "Deposit ledger event kind. Application to charges is NOT a DepositTransaction type; it is the independent DepositApplication entity."
      enum: [RECEIVED, REFUNDED, FORFEITED]
    AssignmentStatus:
      type: string
      enum: [ACTIVE, ENDED]
    AssignmentEndReason:
      type: string
      description: "Why a bed assignment ended. Null on legacy rows (LEGACY_UNKNOWN per D-04)."
      enum: [CHECKOUT, TRANSFER, TERMINATE, MANUAL_END]
    SyncAction:
      type: string
      enum: [UPSERT, TOMBSTONE]
    PackageComponentKind:
      type: string
      enum: [ACCOMMODATION, BOARD, SERVICE]
    MaintenanceStatus:
      type: string
      enum: [OPERATIONAL, NEEDS_CLEANING, NEEDS_REPAIR, OUT_OF_SERVICE]
    AbsenceStatus:
      type: string
      description: "REQUESTED/APPROVED/ADJUSTED = before actual return; RETURNED = actualReturnDate recorded but AbsenceCredit not yet generated; CLOSED = credits generated and absence finalized."
      enum: [REQUESTED, APPROVED, ADJUSTED, RETURNED, CLOSED]
    Organization:
      type: object
      required: [id, version, name, timezone, defaultCurrency, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer }
        name: { type: string }
        timezone: { type: string }
        defaultCurrency: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    MembershipSummary:
      type: object
      required: [organizationId, organizationName, role, active]
      properties:
        membershipId: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        organizationName: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        active: { type: boolean }
    Membership:
      type: object
      required: [id, userId, role, active, createdAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        role: { $ref: '#/components/schemas/Role' }
        active: { type: boolean }
        fullName: { type: string }
        email: { type: string }
        createdAt: { type: string, format: date-time }
    Hostel:
      type: object
      required: [id, version, organizationId, name, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer }
        memberships:
          type: array
          items: { $ref: '#/components/schemas/MembershipSummary' }
        name: { type: string }
        address: { type: string }
        contactPhone: { type: string }
        defaultRentAmount: { type: integer }
        rentDueDayOfMonth: { type: integer }
        absenceMinDays: { type: integer }
        notes: { type: string }
        status: { type: string, enum: [ACTIVE, ARCHIVED] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Room:
      type: object
      required: [id, version, organizationId, hostelId, code, floor, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer }
        memberships:
          type: array
          items: { $ref: '#/components/schemas/MembershipSummary' }
        hostelId: { type: string, format: uuid }
        code: { type: string }
        floor: { type: integer }
        notes: { type: string }
        maintenanceStatus: { $ref: '#/components/schemas/MaintenanceStatus' }
        status: { type: string, enum: [ACTIVE, ARCHIVED] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Bed:
      type: object
      required: [id, version, organizationId, roomId, code, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer }
        memberships:
          type: array
          items: { $ref: '#/components/schemas/MembershipSummary' }
        roomId: { type: string, format: uuid }
        code: { type: string }
        notes: { type: string }
        maintenanceStatus: { $ref: '#/components/schemas/MaintenanceStatus' }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Resident:
      type: object
      required: [id, version, organizationId, fullName, type, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer }
        memberships:
          type: array
          items: { $ref: '#/components/schemas/MembershipSummary' }
        fullName: { type: string }
        type: { $ref: '#/components/schemas/ResidentType' }
        phone: { type: string }
        emergencyContactName: { type: string }
        emergencyContactPhone: { type: string }
        emergencyContactRelation: { type: string }
        notes: { type: string }
        status: { $ref: '#/components/schemas/ResidentStatus' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    StayContract:
      type: object
      description: "`endDate` is exclusive (half-open [startDate, endDate)); `lastOccupiedDateInclusive` (= endDate - 1 day) is the last billable/shown stay day."
      required: [id, version, organizationId, hostelId, residentId, contractNumber, status, startDate, rent, billingCycle, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer }
        organizationId: { type: string, format: uuid }
        hostelId: { type: string, format: uuid }
        residentId: { type: string, format: uuid }
        contractNumber: { type: string }
        status: { $ref: '#/components/schemas/ContractStatus' }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date, nullable: true, description: "Exclusive end of the half-open interval; null = open-ended." }
        lastOccupiedDateInclusive: { type: string, format: date, nullable: true, readOnly: true, description: "Computed: endDate - 1 day; null when endDate is null." }
        rent: { $ref: '#/components/schemas/Money' }
        billingCycle: { type: string }
        deposit: { $ref: '#/components/schemas/Money' }
        packageId: { type: string, format: uuid }
        packageComponents:
          type: array
          items: { $ref: '#/components/schemas/PackageComponent' }
        notes: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    BedAssignment:
      type: object
      description: "`endDate` is exclusive (half-open [startDate, endDate)); `lastOccupiedDateInclusive` (= endDate - 1 day) is the last occupied day shown to the user."
      required: [id, version, organizationId, bedId, residentId, contractId, status, startDate, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer }
        organizationId: { type: string, format: uuid }
        bedId: { type: string, format: uuid }
        residentId: { type: string, format: uuid }
        contractId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/AssignmentStatus' }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date, nullable: true, description: "Exclusive end of the half-open interval; null = open-ended." }
        lastOccupiedDateInclusive: { type: string, format: date, nullable: true, readOnly: true, description: "Computed: endDate - 1 day; null when endDate is null." }
        endReason: { $ref: '#/components/schemas/AssignmentEndReason', nullable: true, description: "Why the assignment ended; null for legacy rows (LEGACY_UNKNOWN per D-04)." }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Charge:
      type: object
      description: "Obligation posting. `entrySide` is DEBIT for normal charges (RENT/UTILITY/DAMAGE/OTHER) and CREDIT for positive-amount discounts/absence credits. `periodEnd` is exclusive (half-open)."
      required: [id, version, organizationId, residentId, type, entrySide, status, money, periodStart, periodEnd, dueDate, postedAt, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer }
        organizationId: { type: string, format: uuid }
        residentId: { type: string, format: uuid }
        contractId: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/ChargeType' }
        entrySide: { $ref: '#/components/schemas/EntrySide' }
        status: { $ref: '#/components/schemas/LedgerEntryStatus' }
        money: { $ref: '#/components/schemas/Money' }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        dueDate: { type: string, format: date }
        description: { type: string }
        reversedBy: { type: string, format: uuid }
        postedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AbsenceCredit:
      type: object
      description: "Monthly absence credit line (one per calendar month). Uniquely keyed by (absenceId, periodStart) so a multi-month absence yields several month rows (F-21). Links the absence to the emitted CREDIT posting."
      required: [id, organizationId, residentId, absenceId, chargeId, periodStart, periodEnd, money, createdAt]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        residentId: { type: string, format: uuid }
        absenceId: { type: string, format: uuid }
        chargeId: { type: string, format: uuid }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        money: { $ref: '#/components/schemas/Money' }
        createdAt: { type: string, format: date-time }
    AbsenceCreditResult:
      type: object
      description: "Result of generating absence credits: all monthly AbsenceCredit lines produced for an absence, plus the total credit amount."
      required: [credits, totalCredit]
      properties:
        credits:
          type: array
          items: { $ref: '#/components/schemas/AbsenceCredit' }
        totalCredit: { $ref: '#/components/schemas/Amount' }
    PaymentAllocation:
      type: object
      required: [id, paymentId, chargeId, money, createdAt]
      properties:
        id: { type: string, format: uuid }
        paymentId: { type: string, format: uuid }
        chargeId: { type: string, format: uuid }
        money: { $ref: '#/components/schemas/Money' }
        createdAt: { type: string, format: date-time }
    Payment:
      type: object
      description: "Received funds (unallocated on creation). `receiptNumber` is the official, organization-unique, server-issued number; it is never supplied by the client (D-03/D-17). `provisionalReceiptId` echoes the offline client's local id when present."
      required: [id, version, organizationId, residentId, status, money, method, receivedAt, receiptNumber, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer }
        organizationId: { type: string, format: uuid }
        residentId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/LedgerEntryStatus' }
        money: { $ref: '#/components/schemas/Money' }
        method: { $ref: '#/components/schemas/PaymentMethod' }
        receivedAt: { type: string, format: date }
        receiptNumber: { type: string }
        provisionalReceiptId: { type: string }
        provisionalReceipt: { $ref: '#/components/schemas/ProvisionalReceipt' }
        notes: { type: string }
        payerName: { type: string }
        payerPhone: { type: string }
        payerRelation: { type: string }
        reversedBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        allocations:
          type: array
          items: { $ref: '#/components/schemas/PaymentAllocation' }
    DepositTransaction:
      type: object
      description: "Append-only deposit ledger event: RECEIVED, REFUNDED, FORFEITED, or a correction void. Deposit-to-charge application is a separate DepositApplication entity (never a DepositTransaction)."
      required: [id, version, organizationId, residentId, type, status, money, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer }
        organizationId: { type: string, format: uuid }
        residentId: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/DepositType' }
        status: { $ref: '#/components/schemas/LedgerEntryStatus' }
        money: { $ref: '#/components/schemas/Money' }
        receivedAt: { type: string, format: date }
        reason: { type: string }
        actorUserId: { type: string, format: uuid }
        reversedBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Expense:
      type: object
      description: "Paid expense only (D-14); no accounts payable. Void via an immutable reversal event, not by rewrite."
      required: [id, version, organizationId, category, status, money, spentAt, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer }
        organizationId: { type: string, format: uuid }
        hostelId: { type: string, format: uuid }
        category: { type: string }
        status: { $ref: '#/components/schemas/LedgerEntryStatus' }
        money: { $ref: '#/components/schemas/Money' }
        spentAt: { type: string, format: date }
        paymentMethod: { $ref: '#/components/schemas/PaymentMethod' }
        description: { type: string }
        actorUserId: { type: string, format: uuid }
        reversedBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    EntrySide:
      type: string
      enum: [DEBIT, CREDIT]
    LedgerReversal:
      type: object
      description: "Reversal event. `side` MUST be the opposite of the source posting's side (a DEBIT charge reverses with CREDIT, and vice versa). A credit is a Charge with entrySide=CREDIT, so it reverses under sourceType=CHARGE. Append-only."
      required: [id, organizationId, residentId, sourceType, sourceId, side, money, reason, actorUserId, idempotencyKey, createdAt]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        residentId: { type: string, format: uuid }
        sourceType: { type: string, enum: [CHARGE, PAYMENT, DEPOSIT, EXPENSE] }
        sourceId: { type: string, format: uuid }
        side: { $ref: '#/components/schemas/EntrySide' }
        money: { $ref: '#/components/schemas/Money' }
        reason: { type: string }
        actorUserId: { type: string, format: uuid }
        idempotencyKey: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
    AllocationRelease:
      type: object
      description: "Append-only release of (part of) a payment allocation. The sum of releases for one allocation MUST NOT exceed the allocation amount; releases precede payment void/reversal so no voided payment keeps live allocations in the balance."
      required: [id, organizationId, residentId, allocationId, money, reason, actorUserId, createdAt]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        residentId: { type: string, format: uuid }
        allocationId: { type: string, format: uuid }
        money: { $ref: '#/components/schemas/Money' }
        reason: { type: string }
        actorUserId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
    AllocationReleaseRequest:
      type: object
      required: [money, reason]
      properties:
        money: { $ref: '#/components/schemas/Money' }
        reason: { type: string, minLength: 1, maxLength: 500 }
    PaymentRefund:
      type: object
      description: "Actual cash return to the payer (outflow), separate from a payment reversal/void. Only the unallocated amount of a payment can be refunded."
      required: [id, organizationId, residentId, paymentId, money, reason, actorUserId, createdAt]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        residentId: { type: string, format: uuid }
        paymentId: { type: string, format: uuid }
        money: { $ref: '#/components/schemas/Money' }
        reason: { type: string }
        actorUserId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
    PaymentRefundRequest:
      type: object
      required: [money, reason]
      properties:
        money: { $ref: '#/components/schemas/Money' }
        reason: { type: string, minLength: 1, maxLength: 500 }
    PaymentVoidResult:
      type: object
      description: "Result of an atomic payment void: the reversed payment plus the append-only AllocationRelease events and the LedgerReversal created in the same transaction."
      required: [payment, releases, reversal]
      properties:
        payment: { $ref: '#/components/schemas/Payment' }
        releases:
          type: array
          items: { $ref: '#/components/schemas/AllocationRelease' }
        reversal: { $ref: '#/components/schemas/LedgerReversal' }
    ProvisionalReceipt:
      type: object
      description: "Server-side receipt mapping: a client-local `provisionalReceiptId` mapped to the organization-official `receiptNumber` after server accept/commit. Server responses are always `ISSUED`; `PENDING_SYNC` exists only as a local Flutter/Drift client state and never appears in a server document."
      required: [provisionalReceiptId, status]
      properties:
        provisionalReceiptId: { type: string }
        officialReceiptNumber: { type: string }
        status: { type: string, enum: [ISSUED] }
    UnallocatedBalance:
      type: object
      required: [residentId, amount]
      properties:
        residentId: { type: string, format: uuid }
        amount: { $ref: '#/components/schemas/Amount' }
    DepositApplicationRequest:
      type: object
      description: "Applies a specific deposit to selected charges at final checkout (D-10). Explicit manager action only; never automatic. `depositTransactionId` selects WHICH received deposit is consumed; each line references a resident charge. Total must not exceed the selected deposit's available balance or each charge's outstanding amount."
      required: [depositTransactionId, charges, reason]
      properties:
        depositTransactionId: { type: string, format: uuid }
        reason: { type: string, minLength: 1, maxLength: 500 }
        charges:
          type: array
          minItems: 1
          items:
            type: object
            required: [chargeId, money]
            properties:
              chargeId: { type: string, format: uuid }
              money: { $ref: '#/components/schemas/Money' }
    DepositApplication:
      type: object
      description: "Independent, append-only record of deposit-to-charge application (D-10). Not a PaymentAllocation and not a DepositTransaction. Links the organization, resident, the deposit ledger event, and the charge line."
      required: [id, organizationId, residentId, depositTransactionId, chargeId, money, reason, actorUserId, createdAt]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        residentId: { type: string, format: uuid }
        depositTransactionId: { type: string, format: uuid }
        chargeId: { type: string, format: uuid }
        money: { $ref: '#/components/schemas/Money' }
        reason: { type: string }
        actorUserId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
    DepositApplicationResult:
      type: object
      description: "Atomic result of applying one deposit to multiple charges (D-10). The whole operation is all-or-nothing: if any single application fails, none is persisted."
      required: [applications, totalApplied, remainingDepositBalance]
      properties:
        applications:
          type: array
          items: { $ref: '#/components/schemas/DepositApplication' }
        totalApplied: { $ref: '#/components/schemas/Amount' }
        remainingDepositBalance: { $ref: '#/components/schemas/Amount' }
    DepositRefundRequest:
      type: object
      description: "Refund of a received deposit (full or partial). Refunded + applied + forfeited must never exceed the held amount (D-08)."
      required: [money, reason]
      properties:
        money: { $ref: '#/components/schemas/Money' }
        reason: { type: string, minLength: 1, maxLength: 500 }
    DepositForfeitRequest:
      type: object
      description: "Forfeit of a deposit (full or partial). Shown separately as deposit income — not a resident payment and not an expense (D-09)."
      required: [money, reason]
      properties:
        money: { $ref: '#/components/schemas/Money' }
        reason: { type: string, minLength: 1, maxLength: 500 }
    BillingComponent:
      type: object
      required: [kind, name, amount]
      properties:
        kind: { $ref: '#/components/schemas/PackageComponentKind' }
        name: { type: string }
        amount: { type: integer, minimum: 0, maximum: 2147483647 }
    BillingLine:
      type: object
      required: [residentId, contractId, money, periodStart, periodEnd, components]
      properties:
        residentId: { type: string, format: uuid }
        contractId: { type: string, format: uuid }
        money: { $ref: '#/components/schemas/Money' }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        components:
          type: array
          items: { $ref: '#/components/schemas/BillingComponent' }
    BillingPreview:
      type: object
      required: [periodStart, periodEnd, lines, totalAmount]
      properties:
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        lines:
          type: array
          items: { $ref: '#/components/schemas/BillingLine' }
        totalAmount: { $ref: '#/components/schemas/Amount' }
    BillingPreviewRequest:
      type: object
      description: "Preview-only request (no side effects, no Idempotency-Key), for a single calendar month `[periodStart=first-of-month, periodEnd=first-of-next-month)`. `dueDayOfMonth` (1..28, clamped to month end) overrides each hostel's rent due-day default; `residentId` optionally narrows the preview to a single resident."
      required: [periodStart, periodEnd]
      properties:
        periodStart: { type: string, format: date, description: "First day of the month." }
        periodEnd: { type: string, format: date, description: "First day of the next month (exclusive)." }
        residentId: { type: string, format: uuid }
        dueDayOfMonth: { type: integer, minimum: 1, maximum: 28 }
    BillingPostRequest:
      type: object
      description: "Final, idempotent billing issuance for one full calendar month `[periodStart=first-of-month, periodEnd=first-of-next-month)`. Requires Idempotency-Key; the (organization, periodStart, periodEnd) business key forbids issuing the same rent period twice (F-23). Post always covers the whole organization; there is no per-resident Post."
      required: [periodStart, periodEnd]
      properties:
        periodStart: { type: string, format: date, description: "First day of the month." }
        periodEnd: { type: string, format: date, description: "First day of the next month (exclusive)." }
        dueDayOfMonth: { type: integer, minimum: 1, maximum: 28 }
    BillingRun:
      type: object
      description: "Result of a billing operation. POSTED runs carry a stable `businessKey` (organization+period) and can never re-issue the same period."
      required: [id, organizationId, periodStart, periodEnd, status, totalAmount, createdAt]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        businessKey: { type: string }
        dueDayOfMonth: { type: integer, minimum: 1, maximum: 28 }
        status: { type: string, enum: [PREVIEW, POSTED] }
        totalAmount: { $ref: '#/components/schemas/Amount' }
        createdByUserId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
    AccountBuckets:
      type: object
      required: [outstandingReceivable, unappliedCredit, depositHeld]
      properties:
        outstandingReceivable: { $ref: '#/components/schemas/Amount' }
        unappliedCredit: { $ref: '#/components/schemas/Amount' }
        depositHeld: { $ref: '#/components/schemas/Amount' }
    ResidentAccount:
      type: object
      required: [residentId, totalCharged, totalPaid, allocatedBalance, unallocatedCredit, outstandingBalance, depositBalance]
      properties:
        residentId: { type: string, format: uuid }
        totalCharged: { $ref: '#/components/schemas/Amount' }
        totalPaid: { $ref: '#/components/schemas/Amount' }
